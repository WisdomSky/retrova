name: Release build

# Builds every Retrova installer from the checked-in source on a clean GitHub runner, records a signed
# build attestation (provenance) for each file, and publishes a GitHub release with all the installers
# and SHA256SUMS attached — both on a v* tag push and on a manual "Run workflow" dispatch.
# ci/** branch pushes only build and upload the CI artifact.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.1.4). Leave blank to use retrova.__version__."
        required: false
        type: string
  push:
    tags: ["v*"]
    branches: ["ci/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
    permissions:
      contents: read
      id-token: write       # lets GitHub sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine and verify release tag
        id: release_tag
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          import re

          text = open("retrova/__init__.py", encoding="utf-8").read()
          match = re.search(r"""__version__\s*=\s*['"]([^'"]+)['"]""", text)
          if not match:
              raise SystemExit("could not read retrova.__version__")
          version = match.group(1)

          event = os.environ["GITHUB_EVENT_NAME"]
          if event == "workflow_dispatch":
              # Manual run: use the typed tag, or fall back to the version in the source.
              tag = os.environ.get("RELEASE_TAG_INPUT", "").strip() or "v" + version
          else:
              tag = os.environ["GITHUB_REF_NAME"]

          if tag.lstrip("v") != version:
              raise SystemExit(f"release tag {tag} does not match retrova.__version__ {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"tag={tag}\n")
          print(f"release tag: {tag} (version {version}, event {event})")
          PY

      - name: Build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 hfsprogs cmake \
            build-essential git zip unzip zlib1g-dev libbz2-dev liblzma-dev libssl-dev python3 python3-venv \
            python3-pip curl ca-certificates rsync libcairo2 libffi-dev pkg-config \
            dosfstools mtools e2fsprogs xfsprogs btrfs-progs exfatprogs fdisk

      - name: Build installers
        run: packaging/build_all.sh

      - name: Checksums
        run: |
          cd dist
          ls -l
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: retrova-installers
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create the release and upload its assets
    steps:
      # gh needs a git checkout (and repo context) to resolve/create the release tag.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: retrova-installers
          path: dist/

      - name: List release assets
        run: |
          cd dist
          ls -l
          cat SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          assets=(dist/*)
          if gh release view "$tag" >/dev/null 2>&1; then
            # A re-run of the workflow: replace the assets rather than failing on an existing release.
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --target "${GITHUB_SHA}" \
              --title "Retrova $tag" \
              --generate-notes
          fi
